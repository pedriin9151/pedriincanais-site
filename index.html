<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela de Preços - PedriinCanais</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h2 {
      margin-bottom: 20px;
      color: #f8fafc;
    }

    /* Container dos Botões de Seleção de Moeda */
    .currency-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .currency-btn {
      background-color: #1e293b;
      color: #94a3b8;
      border: 2px solid #334155;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .currency-btn:hover {
      border-color: #38bdf8;
      color: #ffffff;
    }

    .currency-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Grid dos Cards de Planos */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .plan-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .plan-card:hover {
      transform: translateY(-4px);
    }

    .plan-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .plan-price {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>Escolha seu Plano</h2>

  <!-- Botões para Alternar a Moeda -->
  <div class="currency-selector">
    <button class="currency-btn active" onclick="setCurrency('brl')">R$ Real</button>
    <button class="currency-btn" onclick="setCurrency('jpy')">¥ Iene</button>
    <button class="currency-btn" onclick="setCurrency('usd')">$ Dólar</button>
  </div>

  <!-- Cards de Planos -->
  <div class="pricing-grid">
    <div class="plan-card">
      <div class="plan-title">1 Tela</div>
      <div class="plan-price" id="plan-1tela">R$ 35,00</div>
    </div>

    <div class="plan-card">
      <div class="plan-title">2 Telas</div>
      <div class="plan-price" id="plan-2telas">R$ 55,00</div>
    </div>

    <div class="plan-card">
      <div class="plan-title">Trimestral</div>
      <div class="plan-price" id="plan-trimestral">R$ 95,00</div>
    </div>

    <div class="plan-card">
      <div class="plan-title">Semestral</div>
      <div class="plan-price" id="plan-semestral">R$ 160,00</div>
    </div>

    <div class="plan-card">
      <div class="plan-title">Anual</div>
      <div class="plan-price" id="plan-anual">R$ 250,00</div>
    </div>
  </div>

  <script>
    // Mapeamento de Valores em Cada Moeda
    const prices = {
      brl: {
        '1tela': 'R$ 35,00',
        '2telas': 'R$ 55,00',
        'trimestral': 'R$ 95,00',
        'semestral': 'R$ 160,00',
        'anual': 'R$ 250,00'
      },
      jpy: {
        '1tela': '1000 ¥',
        '2telas': '1600 ¥',
        'trimestral': '2800 ¥',
        'semestral': '4700 ¥',
        'anual': '7300 ¥'
      },
      usd: {
        '1tela': '35$',
        '2telas': '55$',
        'trimestral': '95$',
        'semestral': '160$',
        'anual': '250$'
      }
    };

    function setCurrency(currency) {
      // Atualiza o estado ativo dos botões
      const buttons = document.querySelectorAll('.currency-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Atualiza os textos dos preços
      document.getElementById('plan-1tela').innerText = prices[currency]['1tela'];
      document.getElementById('plan-2telas').innerText = prices[currency]['2telas'];
      document.getElementById('plan-trimestral').innerText = prices[currency]['trimestral'];
      document.getElementById('plan-semestral').innerText = prices[currency]['semestral'];
      document.getElementById('plan-anual').innerText = prices[currency]['anual'];
    }
  </script>

</body>
</html>
